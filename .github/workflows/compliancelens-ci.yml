# ComplianceLens CI: lint + tests on GitHub whenever compliance-lens/ changes.
# Tests use fake AWS (moto), recorded GitHub replies and a fake website on 127.0.0.1
# for the browser tests, so no secrets or real accounts are needed.
name: ComplianceLens CI

on:
  push:
    paths:
      - "compliance-lens/**"
      - ".github/workflows/compliancelens-ci.yml"
  pull_request:
    paths:
      - "compliance-lens/**"
      - ".github/workflows/compliancelens-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compliance-lens

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: compliance-lens/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Headless Chromium for the browser tests (V3). They only open the local fake
      # website; tests block every other address. CI=true makes them fail, not skip,
      # if Chromium is missing.
      - name: Install Chromium
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests with coverage (must stay >= 70%)
        run: pytest --cov

      # The installed package must carry the AI prompt, schema and model list, and (V5) the
      # dashboard's templates and static files. The editable install above reads them from
      # this folder, so it would hide a missing file.
      - name: Packaged files (wheel in a clean environment)
        run: |
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "from compliancelens.evaluator import prompt, settings; prompt.system_prompt(); prompt.answer_schema(); settings.catalog(); print('packaged files OK')"
          cd /tmp && /tmp/wheel-check/bin/python -c "from importlib.resources import files; d = files('compliancelens.dashboard'); missing = [n for n in ('templates/base.html', 'templates/detail.html', 'templates/_progress.html', 'static/app.js', 'static/style.css') if not d.joinpath(n).is_file()]; assert not missing, missing; print('dashboard files OK')"
