<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body><h1>Sign in</h1>
<script>
  // Like a person logging in while the terminal waits for Enter: the page logs in
  // and moves to the home page by itself, with no call from Playwright.
  setTimeout(function () {
    document.cookie = "session=ok; path=/";
    window.location.href = "/home";
  }, 300);
</script></body></html>
