<!doctype html>
<html><head><meta charset="utf-8"><meta name="test-user" content="tester"><title>Account settings</title>
<style>body { margin: 0; font-family: sans-serif; background: white; } .box { width: 320px; padding: 10px; background: white; }</style></head>
<body>
  <!-- Like the AWS console with its account menu open (made-up values). -->
  <header>
    <button id="nav-usernameMenu" class="box" data-testid="more-menu__awsc-nav-account-menu-button"
      aria-expanded="true">example-account (123456789012)</button>
    <div id="menu--account" class="box" data-testid="awsc-nav-account-menu-content">
      <div data-testid="account-detail-menu">
        <span>Account ID</span> <span>1234-5678-9012</span>
        <span>Account name</span> <span>example-account</span>
        <span>IAM user</span> <span>example-user</span>
      </div>
    </div>
  </header>
  <main>
    <h1>Account settings</h1>
    <p id="arn" class="box">arn:aws:iam::123456789012:user/example-user</p>
    <p id="dashed" class="box">1234-5678-9012</p>
  </main>
</body></html>
