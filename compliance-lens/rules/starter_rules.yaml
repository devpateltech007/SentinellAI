# ComplianceLens rulebook (V4; targets in the settings since V6): 19 rules across AWS, GitHub, the HR list and policy documents.
# How to write a rule card: see rules/README.md.
#
# Who judges (V6): 15 rules are judged by code from API data; GH-07 by the AI reading its
# screenshot; DOC-01 to DOC-03 by the AI reading a policy document. GH-06 was judged by
# the AI until V6; the research experiment showed its API value is readable with the
# audit's token, so code judges it now. An `ai_check` on a code rule is only used by
# `run --cross-check`, which records whether the AI reads the screenshot the same way; it
# never changes the code's verdict.
#
# Each rule can be broken and fixed on purpose (or, where that is unsafe, is
# tested with fake data): see scripts/README.md.
#
# `remediation` (V6) is the suggested fix the report shows under a failed rule. It is
# written by hand here, saved with each run (rulebook.yaml, run-context.json), and never
# made from evidence.
#
# What to audit comes from config/settings.yaml (V6; copy config/settings.example.yaml):
# the GitHub organization, repository and branch, the AWS region, the screenshot targets
# and the HR list. A setting fills only what a card leaves out, so a card may still name
# its own value (see rules/README.md). Nothing account-specific is written here.
#
# V3 screenshots: every rule with a web page has a `screenshot:` block. The API data
# stays the proof; the screenshot is for people. {region}, {org}, {repo}, {rule} (the
# classic branch protection rule's number) and {bucket} come from the settings. Log in
# once with `python audit.py login aws` / `github`. If a page changed, fix its locators.

# --- AWS -------------------------------------------------------------------

- id: AWS-01
  title: Password policy requires 12+ characters
  framework_ref: CIS AWS 1.8
  severity: medium
  remediation: >-
    IAM > Account settings > Password policy: set the minimum length to 12 characters or
    more (14 is the usual choice). Existing passwords follow the new policy when they
    are next changed.
  collector: aws.password_policy
  params: {}
  check: { field: MinimumPasswordLength, op: ">=", value: 12 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/account_settings"
    wait_for: { text: "Password minimum length" }   # shown once the policy has loaded
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }
  ai_check:   # --cross-check only
    expect: "The password policy's minimum password length is 12 characters or more."
    pass_if: ["Password minimum length shows 12 or more characters"]
    fail_if: ["Password minimum length shows fewer than 12 characters", "No password policy is set"]
    review_if: ["The password policy section is not visible, cut off or still loading"]

- id: AWS-02
  title: Every IAM user with a console password has MFA
  framework_ref: CIS AWS 1.10
  severity: high
  remediation: >-
    For each user named: IAM > Users > the user > Security credentials > Assign MFA
    device. If the user doesn't need the console, remove their console password instead.
  collector: aws.users_without_mfa
  params: {}
  check: { field: count, op: "==", value: 0 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/users"
    # the user table, once no column header shows a spinner: rows appear before the
    # MFA, activity, password and access key columns have loaded
    wait_for: { css: "table:has(a[href*='users/details']):not(:has(thead [class*='circle-left']))" }
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }
  ai_check:   # --cross-check only
    expect: "Every IAM user who has a console password also has an MFA device."
    pass_if: ["Every user with a Password age shows an MFA device"]
    fail_if: ["A user with a Password age shows no MFA device (a dash in the MFA column)"]
    review_if: ["The MFA or Password age columns are not visible, cut off or still loading"]

- id: AWS-03
  title: Root account has MFA
  framework_ref: CIS AWS 1.5
  severity: high
  remediation: >-
    Sign in as the root user and assign an MFA device (Security credentials >
    Multi-factor authentication). Prefer a hardware key and keep its recovery details
    offline.
  collector: aws.root_account_mfa
  params: {}
  check: { field: AccountMFAEnabled, op: "==", value: 1 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/home"
    wait_for: { text: "Root user has MFA" }
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }

- id: AWS-04
  title: No active access key is older than 90 days
  framework_ref: CIS AWS 1.14
  severity: medium
  remediation: >-
    For each key named: create a new access key, move whatever uses the old one to it,
    then deactivate and delete the old key. Prefer roles or short-lived credentials over
    long-lived keys.
  collector: aws.access_key_age
  params: { max_age_days: 90 }
  check: { field: count, op: "==", value: 0 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/users"
    # the user table, once no column header shows a spinner: rows appear before the
    # MFA, activity, password and access key columns have loaded
    wait_for: { css: "table:has(a[href*='users/details']):not(:has(thead [class*='circle-left']))" }
    steps:
      - scroll_to: { role: columnheader, name: "Active key age" }
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }

- id: AWS-05
  title: Every S3 bucket blocks public access
  framework_ref: CIS AWS 2.1.4
  severity: high
  remediation: >-
    For each bucket named: bucket > Permissions > Block public access, turn on all four
    settings. Turn them on for the whole account too, unless a bucket must be public by
    design.
  collector: aws.s3_public_access
  params: {}
  check: { field: buckets_fully_blocked, op: all_true }
  screenshot:   # aws.screenshot_bucket only (a test bucket); the API checks every bucket
    site: aws
    caption: "Shows the screenshot bucket only; the API checked every bucket."
    url: "https://{region}.console.aws.amazon.com/s3/buckets/{bucket}?region={region}&tab=permissions"
    wait_for: { text: "Individual Block Public Access settings for this bucket" }   # On/Off has loaded
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }
  ai_check:   # --cross-check only: the picture shows one bucket, the API checks them all
    expect: "Block all public access is On for this bucket."
    pass_if: ["Block all public access shows On"]
    fail_if: ["Block all public access shows Off"]
    review_if: ["The Block public access box is not visible or still loading"]
    comparable: false

- id: AWS-06
  title: Every S3 bucket has versioning on
  severity: low
  remediation: >-
    For each bucket named: bucket > Properties > Bucket Versioning > Enable. A lifecycle
    rule that expires old versions keeps the storage cost bounded.
  collector: aws.s3_versioning
  params: {}
  check: { field: versioning_enabled, op: all_true }
  screenshot:   # aws.screenshot_bucket only (a test bucket); the API checks every bucket
    site: aws
    caption: "Shows the screenshot bucket only; the API checked every bucket."
    url: "https://{region}.console.aws.amazon.com/s3/buckets/{bucket}?region={region}&tab=properties"
    wait_for: { text: "Bucket Versioning" }
    steps:
      - scroll_to: { text: "Bucket Versioning" }
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }

- id: AWS-07
  title: At least one CloudTrail trail is logging
  framework_ref: CIS AWS 3.1
  severity: high
  remediation: >-
    CloudTrail > Trails: start logging on the stopped trail, or create a multi-region
    trail that delivers to its own S3 bucket with versioning on.
  collector: aws.cloudtrail_logging
  params: {}
  check: { field: logging_count, op: ">=", value: 1 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/cloudtrailv2/home?region={region}#/trails"
    wait_for: { css: "a[href*='trails/arn']" }   # a trail row has loaded
    steps:
      - scroll_to: { role: columnheader, name: "Status" }   # Logging
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }

- id: AWS-08
  title: No IAM user has been inactive for more than 90 days
  framework_ref: CIS AWS 1.12 (adapted, CIS uses 45 days)
  severity: medium
  remediation: >-
    For each user named: confirm with their manager, then delete the user, or remove
    their console password and access keys if the account must stay.
  collector: aws.unused_users
  params: { max_inactive_days: 90 }
  check: { field: count, op: "==", value: 0 }
  screenshot:
    site: aws
    url: "https://{region}.console.aws.amazon.com/iam/home?region={region}#/users"
    # the user table, once no column header shows a spinner: rows appear before the
    # MFA, activity, password and access key columns have loaded
    wait_for: { css: "table:has(a[href*='users/details']):not(:has(thead [class*='circle-left']))" }
    mask:   # the account menu, and every 12-digit account ID (ARNs, bucket names, URLs)
      - { css: "#nav-usernameMenu, [data-testid=awsc-nav-account-menu-button]" }
      - { pattern: "[0-9]{12}" }

# --- GitHub ------------------------------------------------------------------

- id: GH-01
  title: main branch requires at least 1 review
  framework_ref: CIS GitHub 1.1.3
  severity: high
  remediation: >-
    Repository Settings > Branches > edit the classic protection rule for the branch:
    tick "Require a pull request before merging" with at least 1 required approval.
  collector: github.branch_protection
  params: {}   # repository and branch: config/settings.yaml
  check: { field: required_approving_review_count, op: ">=", value: 1 }
  screenshot:   # the classic rule for the branch: github.protection_rule_id in the settings
    site: github
    url: "https://github.com/{repo}/settings/branch_protection_rules/{rule}"
    wait_for: { text: "Require a pull request before merging" }
    capture: { full_page: true }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar
  ai_check:   # --cross-check only
    expect: "The rule for main requires a pull request with at least 1 approving review."
    pass_if: ["'Require a pull request before merging' is ticked and Required approvals is 1 or more"]
    fail_if: ["'Require a pull request before merging' is not ticked", "Required approvals is 0"]
    review_if: ["The setting is not visible, cut off or still loading"]

- id: GH-02
  title: Force pushes to main are blocked
  severity: high
  remediation: >-
    Repository Settings > Branches > edit the classic protection rule for the branch:
    leave "Allow force pushes" unticked (and "Allow deletions" too).
  collector: github.force_push_protection
  params: {}   # repository and branch: config/settings.yaml
  check: { field: allow_force_pushes, op: "==", value: false }
  screenshot:   # the classic rule for the branch: github.protection_rule_id in the settings
    site: github
    url: "https://github.com/{repo}/settings/branch_protection_rules/{rule}"
    wait_for: { text: "Require a pull request before merging" }
    capture: { full_page: true }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar

- id: GH-03
  title: Secret scanning is enabled
  severity: medium
  remediation: >-
    Repository Settings > Advanced Security: turn on Secret Protection (secret
    scanning), and push protection with it.
  collector: github.secret_scanning
  params: {}   # repository: config/settings.yaml
  check: { field: secret_scanning, op: in, value: [enabled] }
  screenshot:
    site: github
    url: "https://github.com/{repo}/settings/security_analysis"
    wait_for: { text: "Secret Protection" }
    capture: { full_page: true }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar

- id: GH-04
  title: Dependabot alerts are enabled
  severity: medium
  remediation: >-
    Repository Settings > Advanced Security: turn on Dependabot alerts.
  collector: github.dependabot_alerts
  params: {}   # repository: config/settings.yaml
  check: { field: dependabot_alerts, op: "==", value: true }
  screenshot:
    site: github
    url: "https://github.com/{repo}/settings/security_analysis"
    wait_for: { text: "Dependabot alerts" }
    capture: { full_page: true }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar

- id: GH-05
  title: Every organization member has 2FA
  severity: high
  remediation: >-
    Ask each member named to turn on two-factor authentication, then require it for the
    organization (Settings > Authentication security). Members without it are removed
    when you require it.
  collector: github.org_members_without_2fa
  params: {}
  check: { field: count, op: "==", value: 0 }
  screenshot:
    site: github
    url: "https://github.com/orgs/{org}/people?query=two-factor%3Adisabled"
    wait_for: { text: "Members" }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar

# GH-06 and GH-07 are on the organization's Member privileges page (only organization
# owners can open it). GH-06's value is also in the API, so code judges it (V6). The token
# needs the organization's Administration (read); without it GitHub hides the value and
# GH-06 is NEEDS REVIEW, never PASS.

- id: GH-06
  title: Organization base repository permission is Read or None
  severity: medium
  remediation: >-
    Organization Settings > Member privileges > Base permissions: choose Read or No
    permission, and give write access per team or per repository instead.
  collector: github.org_settings
  params: {}   # organization: config/settings.yaml
  check: { field: default_repository_permission, op: in, value: [read, none] }
  screenshot:
    site: github
    url: "https://github.com/organizations/{org}/settings/member_privileges"
    wait_for: { role: heading, name: "Base permissions" }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar
  ai_check:   # --cross-check only
    expect: "The selected base repository permission is Read or No permission."
    pass_if:
      - "The selected value under Base permissions is Read"
      - "The selected value under Base permissions is No permission"
    fail_if: ["The selected value under Base permissions is Write or Admin"]
    review_if:
      - "The Base permissions control is not visible, cut off, covered or still loading"
      - "A list of options is open instead of the selected value"

# Vision rule (V4): no collector and no check; the AI reads the screenshot.

- id: GH-07
  title: Members cannot delete or transfer repositories
  severity: medium
  remediation: >-
    Organization Settings > Member privileges: untick "Allow members to delete or
    transfer repositories for this organization".
  screenshot:   # compliant: "Allow members to delete or transfer repositories" unticked
    site: github
    url: "https://github.com/organizations/{org}/settings/member_privileges"
    wait_for: { text: "Repository deletion and transfer" }
    steps:
      - scroll_to: { text: "Repository deletion and transfer" }
    mask:
      - { role: button, name: "Open user navigation menu" }   # your avatar
  ai_check:
    expect: "'Allow members to delete or transfer repositories for this organization' is not ticked."
    pass_if:
      - "The box 'Allow members to delete or transfer repositories for this organization' is visible and not ticked"
    fail_if: ["That box is ticked"]
    review_if: ["The box is not visible, cut off, covered or unclear"]

# --- HR ----------------------------------------------------------------------

- id: HR-01
  title: Every AWS and GitHub account belongs to an active employee
  framework_ref: SOC 2 CC6.2
  severity: high
  remediation: >-
    For each account named: if the person has left, remove the AWS user or the GitHub
    member; if it is a service account, add it to hr.allow_aws or hr.allow_github in
    config/settings.yaml; if it belongs to a current employee, correct the employee
    list.
  collector: hr.unmatched_accounts
  params: {}   # the employee list and the service accounts: hr in config/settings.yaml
  check: { custom: no_unmatched_accounts }

# --- Policy documents (V4) ----------------------------------------------------
# The AI reads a document from COMPLIANCELENS_POLICIES_DIR (default: the made-up compliant
# samples in policies/examples/compliant). A policy that never states the requirement
# is FAIL (missing_means: fail); one that contradicts itself is NEEDS REVIEW.

- id: DOC-01
  title: Password policy requires 12+ characters
  severity: medium
  remediation: >-
    Change the password policy so every password must be at least 12 characters long,
    with no exception that allows a shorter one, and have its owner approve and publish
    it.
  collector: files.read_document
  params: { path: password-policy.pdf }
  ai_check:
    expect: "Every user password must be at least 12 characters long."
    pass_if: ["The policy sets a minimum password length of 12 characters or more for all passwords"]
    fail_if:
      - "The policy sets a minimum below 12 characters"
      - "The policy lets some passwords be shorter than 12 characters"
    review_if: ["Parts of the policy give different minimum lengths"]
    missing_means: fail

- id: DOC-02
  title: Policy requires MFA for every AWS console user
  severity: high
  remediation: >-
    Change the access control policy to require MFA for every user who can sign in to
    the AWS console, not only for administrators, and have its owner approve and publish
    it.
  collector: files.read_document
  params: { path: access-control-policy.md }
  ai_check:
    expect: "Every user who can sign in to the AWS console must use multi-factor authentication (MFA)."
    pass_if: ["MFA is required for every user who can sign in to the AWS console"]
    fail_if:
      - "MFA is required only for some users, for example administrators"
      - "MFA is optional or only encouraged"
    review_if: ["Parts of the policy disagree about who must use MFA"]
    missing_means: fail

- id: DOC-03
  title: Offboarding removes AWS and GitHub access within 24 hours
  severity: high
  remediation: >-
    Change the offboarding policy so both AWS and GitHub access are removed within 24
    hours of someone leaving, and have its owner approve and publish it.
  collector: files.read_document
  params: { path: offboarding-policy.txt }
  ai_check:
    expect: "When someone leaves, their AWS and GitHub access is removed within 24 hours."
    pass_if: ["Access to both AWS and GitHub is removed within 24 hours or sooner"]
    fail_if:
      - "Access is removed later than 24 hours, for example within days"
      - "Only one of AWS or GitHub is covered"
    review_if: ["Parts of the policy give different time limits"]
    missing_means: fail
