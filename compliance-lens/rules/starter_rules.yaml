# ComplianceLens rulebook (V2): 14 rules across AWS, GitHub and the HR list.
# How to write a rule card: see rules/README.md.
#
# Each rule can be broken and fixed on purpose (or, where that is unsafe, is
# tested with fake data): see scripts/README.md.
#
# GH-05 and HR-01 read the GitHub organization from GITHUB_ORG in .env.

# --- AWS -------------------------------------------------------------------

- id: AWS-01
  title: Password policy requires 12+ characters
  framework_ref: CIS AWS 1.8
  severity: medium
  collector: aws.password_policy
  params: {}
  check: { field: MinimumPasswordLength, op: ">=", value: 12 }

- id: AWS-02
  title: Every IAM user with a console password has MFA
  framework_ref: CIS AWS 1.10
  severity: high
  collector: aws.users_without_mfa
  params: {}
  check: { field: count, op: "==", value: 0 }

- id: AWS-03
  title: Root account has MFA
  framework_ref: CIS AWS 1.5
  severity: high
  collector: aws.root_account_mfa
  params: {}
  check: { field: AccountMFAEnabled, op: "==", value: 1 }

- id: AWS-04
  title: No active access key is older than 90 days
  framework_ref: CIS AWS 1.14
  severity: medium
  collector: aws.access_key_age
  params: { max_age_days: 90 }
  check: { field: count, op: "==", value: 0 }

- id: AWS-05
  title: Every S3 bucket blocks public access
  framework_ref: CIS AWS 2.1.4
  severity: high
  collector: aws.s3_public_access
  params: {}
  check: { field: buckets_fully_blocked, op: all_true }

- id: AWS-06
  title: Every S3 bucket has versioning on
  severity: low
  collector: aws.s3_versioning
  params: {}
  check: { field: versioning_enabled, op: all_true }

- id: AWS-07
  title: At least one CloudTrail trail is logging
  framework_ref: CIS AWS 3.1
  severity: high
  collector: aws.cloudtrail_logging
  params: {}
  check: { field: logging_count, op: ">=", value: 1 }

- id: AWS-08
  title: No IAM user has been inactive for more than 90 days
  framework_ref: CIS AWS 1.12 (adapted, CIS uses 45 days)
  severity: medium
  collector: aws.unused_users
  params: { max_inactive_days: 90 }
  check: { field: count, op: "==", value: 0 }

# --- GitHub ------------------------------------------------------------------

- id: GH-01
  title: main branch requires at least 1 review
  framework_ref: CIS GitHub 1.1.3
  severity: high
  collector: github.branch_protection
  params: { repo: "compliancelens-lab-sjsu/compliancelens-test", branch: main }
  check: { field: required_approving_review_count, op: ">=", value: 1 }

- id: GH-02
  title: Force pushes to main are blocked
  severity: high
  collector: github.force_push_protection
  params: { repo: "compliancelens-lab-sjsu/compliancelens-test", branch: main }
  check: { field: allow_force_pushes, op: "==", value: false }

- id: GH-03
  title: Secret scanning is enabled
  severity: medium
  collector: github.secret_scanning
  params: { repo: "compliancelens-lab-sjsu/compliancelens-test" }
  check: { field: secret_scanning, op: in, value: [enabled] }

- id: GH-04
  title: Dependabot alerts are enabled
  severity: medium
  collector: github.dependabot_alerts
  params: { repo: "compliancelens-lab-sjsu/compliancelens-test" }
  check: { field: dependabot_alerts, op: "==", value: true }

- id: GH-05
  title: Every organization member has 2FA
  severity: high
  collector: github.org_members_without_2fa
  params: {}
  check: { field: count, op: "==", value: 0 }

# --- HR ----------------------------------------------------------------------

- id: HR-01
  title: Every AWS and GitHub account belongs to an active employee
  framework_ref: SOC 2 CC6.2
  severity: high
  collector: hr.unmatched_accounts
  params:
    employees_file: data/employees.csv
    allow_aws: [compliancelens-audit]   # service accounts with no employee
    allow_github: []
  check: { custom: no_unmatched_accounts }
