# pyproject.toml: package info plus settings for ruff, pytest and coverage.
# Exact dependency versions live in requirements.txt (runtime) and
# requirements-dev.txt (dev tools).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compliancelens"
description = "Checks security rules across AWS and GitHub, collects evidence, and decides PASS, FAIL or NEEDS REVIEW."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "compliancelens.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["compliancelens*"]

# Non-Python files the package needs at run time (V4: the AI prompt, schema and model list;
# V5: the dashboard's page templates, stylesheet and script; V6: the report's template).
[tool.setuptools.package-data]
"compliancelens.evaluator" = ["models.json", "prompts/*.txt", "prompts/*.json"]
"compliancelens.dashboard" = ["templates/*.html", "static/*.css", "static/*.js"]
"compliancelens.reporting" = ["templates/*.html", "templates/*.css"]  # V6: the audit report

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names etc.), I: import order,
# B: common bug patterns, UP: modern Python syntax, SIM: simpler code.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B904",  # `raise ... from err` inside except: optional for this project
]

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]  # the research experiment (experiment/lab) is not part of the package

# ------------------------------------------------------------ coverage ----
[tool.coverage.run]
source = ["compliancelens", "experiment"]
# Playwright's sync API switches greenlets; without this, lines after a page call look unrun.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 70
show_missing = true
